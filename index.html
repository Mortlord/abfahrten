<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161C" media="(prefers-color-scheme: dark)">
<title>Abfahrten</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Abfahrten">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #E9EDF0;
    --surface: #FFFFFF;
    --ink: #15212B;
    --muted: #5E6B76;
    --rule: #CDD5DB;
    --late: #C2271D;
    --ok: #24774A;
    --focus: #1F5FBF;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #10161C;
      --surface: #19222A;
      --ink: #EEF2F5;
      --muted: #93A1AC;
      --rule: #2B3742;
      --late: #FF6B5E;
      --ok: #5CC88A;
      --focus: #7FB0FF;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.4 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
  }

  header h1 {
    font: 700 clamp(2.1rem, 9vw, 3.2rem)/1 var(--cond);
    letter-spacing: -0.01em;
    margin: 0 0 0.35rem;
    overflow-wrap: anywhere;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }

  .stops {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 1rem 0 0.25rem;
    scrollbar-width: none;
  }
  .stops::-webkit-scrollbar { display: none; }
  .stops button {
    flex: none;
    font: 500 0.95rem/1 var(--body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0.55rem 0.9rem;
    cursor: pointer;
  }
  .stops button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .stops button small { color: inherit; opacity: 0.7; margin-left: 0.35rem; }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin: 0.75rem 0 0.5rem;
    font-size: 0.95rem;
  }
  .controls label { display: inline-flex; gap: 0.5rem; align-items: center; cursor: pointer; }
  .controls input { width: 1.1rem; height: 1.1rem; accent-color: var(--ink); }
  .linkbtn {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 0.25rem 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  ol.board {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  ol.board li {
    display: grid;
    grid-template-columns: 3.1rem 1fr auto;
    align-items: center;
    gap: 0.85rem;
    padding: 0.8rem 1rem;
    border-top: 1px solid var(--rule);
  }
  ol.board li:first-child { border-top: 0; }
  ol.board li.cancelled .dest,
  ol.board li.cancelled .min { text-decoration: line-through; opacity: 0.55; }

  .badge {
    width: 3.1rem;
    height: 2.4rem;
    display: grid;
    place-items: center;
    font: 700 1.45rem/1 var(--cond);
    border-radius: 4px;
    background: var(--ink);
    color: var(--bg);
  }
  .badge.long { font-size: 1.05rem; }

  .dest {
    font: 600 1.3rem/1.15 var(--cond);
    overflow-wrap: anywhere;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
  }
  .hiddenNote {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.6rem;
    align-items: center;
  }
  .hiddenNote button {
    font: 500 0.85rem/1 var(--body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
  }
  .sub {
    display: flex;
    flex-wrap: wrap;
    gap: 0 0.75rem;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .sub .late { color: var(--late); font-weight: 500; }
  .sub .ok { color: var(--ok); font-weight: 500; }
  .sub .cancel { color: var(--late); font-weight: 500; }

  .min {
    text-align: right;
    font: 700 2.4rem/0.9 var(--cond);
    font-variant-numeric: tabular-nums;
    min-width: 3.5rem;
  }
  .min span {
    display: block;
    font: 500 0.8rem/1.2 var(--body);
    color: var(--muted);
    margin-top: 0.2rem;
  }
  .min.now { font-size: 1.6rem; }
  .min.clock { font-size: 1.7rem; }

  .state {
    background: var(--surface);
    border-radius: 14px;
    padding: 1.25rem 1rem;
    color: var(--muted);
  }
  .state strong { color: var(--ink); display: block; margin-bottom: 0.25rem; }
  .state button {
    margin-top: 0.75rem;
    font: 500 1rem/1 var(--body);
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
  }

  .trips { padding-top: 0.5rem; }
  .trips button.home { font-weight: 600; border-color: var(--ink); }
  ol.board.trip li { grid-template-columns: 1fr auto; }
  .legs { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.5rem; margin-top: 0.35rem; }
  .badge.sm { width: auto; min-width: 2.2rem; height: 1.7rem; padding: 0 0.35rem; font-size: 1.05rem; }
  .walk { font-size: 0.85rem; color: var(--muted); }
  .times { font: 600 1.3rem/1.15 var(--cond); font-variant-numeric: tabular-nums; }
  .detail { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }
  .detail div + div { margin-top: 0.1rem; }
  .back { margin: 0 0 0.6rem; }
  form.search { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  form.search input {
    flex: 1;
    min-width: 0;
    font: 400 1rem/1 var(--body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0.65rem 1rem;
  }

  footer {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  footer a { color: inherit; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    ol.board.fresh { animation: blink 0.5s ease-out; }
    @keyframes blink { from { opacity: 0.55; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Abfahrten</h1>
    <p class="meta"><span id="dist"></span><span id="updated"></span></p>
  </header>

  <nav class="stops" id="stops" aria-label="Haltestellen in der Nähe"></nav>
  <nav class="stops trips" id="trips" aria-label="Fahrt zu einem Ziel"></nav>

  <div class="controls">
    <label><input type="checkbox" id="tramOnly"> Nur Straßenbahn</label>
    <button class="linkbtn" id="toggleSearch" type="button">Haltestelle suchen</button>
  </div>
  <form class="search" id="searchForm" hidden>
    <input id="searchInput" type="search" placeholder="z. B. Bertoldsbrunnen" autocomplete="off" aria-label="Haltestelle suchen">
  </form>
  <nav class="stops" id="searchResults" aria-label="Suchergebnisse" hidden></nav>

  <div id="content" aria-live="polite"></div>

  <footer>
    Daten: <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous und dessen Datenquellen</a>,
    © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-Mitwirkende</a>.
    Angaben ohne Gewähr.
  </footer>
</main>

<script>
(() => {
  // >>> Hier deine Railway-Adresse eintragen (ohne Schrägstrich am Ende) <<<
  const API_BASE = 'https://abfahrtsmonitor-production-f7b8.up.railway.app';
  // Feste Ziele für die Fahrtsuche. Das erste ist dein Zuhause.
  // name: Haltestellenname, wie er in Freiburg heißt; label: Text auf dem Knopf.
  const TARGETS = [
    { name: 'Paula-Modersohn-Platz', label: 'Nach Hause', home: true },
    { name: 'Bertoldsbrunnen', label: 'Bertoldsbrunnen' },
    { name: 'Högestraße', label: 'Högestraße' },
    { name: 'Tennenbacher Straße', label: 'Tennenbacher Straße' }
  ];
  const REFRESH_MS = 30000;   // neue Daten
  const TICK_MS = 10000;      // Minuten neu rechnen
  const MAX_PLATFORMS = 6;    // Steige pro Haltestelle

  const $ = id => document.getElementById(id);
  const els = {
    title: $('title'), dist: $('dist'), updated: $('updated'), stops: $('stops'),
    content: $('content'), tramOnly: $('tramOnly'), toggleSearch: $('toggleSearch'),
    searchForm: $('searchForm'), trips: $('trips'), searchInput: $('searchInput'), searchResults: $('searchResults')
  };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let groups = [];        // Haltestellen in der Nähe, nach Name gruppiert
  let current = null;     // { name, ids: [], dist }
  let departures = [];
  let lastFetch = null;
  let refreshTimer = null;
  let here = null;        // letzter bekannter Standort
  let trip = null;        // aktives Ziel der Fahrtsuche
  let itineraries = [];
  const norm = t => (t || '').toLowerCase().replace(/ß/g, 'ss').replace(/[^a-z0-9äöü]/g, '');

  els.tramOnly.checked = store.get('tramOnly') ?? true;

  // Ausgeblendete Richtungen pro Haltestelle: { "Haltestelle": ["Ziel", ...] }
  let hidden = store.get('hiddenDirections') || {};
  const hiddenHere = () => (current && hidden[current.name]) || [];
  function setHidden(list) {
    if (list.length) hidden[current.name] = list; else delete hidden[current.name];
    store.set('hiddenDirections', hidden);
    render();
  }

  // ---------- Hilfsfunktionen ----------
  const api = async (path, params) => {
    const q = new URLSearchParams(params).toString();
    const url = `${API_BASE}${path}?${q}`;
    let r;
    try { r = await fetch(url); }
    catch (e) { throw new Error(`Keine Verbindung zu ${API_BASE} (${e.message}). Häufigste Ursache: ALLOWED_ORIGIN in Railway passt nicht.`); }
    if (!r.ok) throw new Error(`Server antwortet mit HTTP ${r.status} auf ${path}`);
    const text = await r.text();
    try { return JSON.parse(text); }
    catch { throw new Error(`Antwort von ${path} ist kein JSON: ${text.slice(0, 120)}`); }
  };

  const distM = (a, b) => {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const x = Math.sin(dLat / 2) ** 2 +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  };

  const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} m entfernt` : `${(m / 1000).toFixed(1).replace('.', ',')} km entfernt`;
  const fmtTime = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const cleanName = n => (n || '').replace(/^Freiburg( im Breisgau)?,\s*/i, '');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hex = c => c && /^#?[0-9a-f]{6}$/i.test(c) ? (c.startsWith('#') ? c : '#' + c) : null;

  function groupStops(places, origin) {
    const byName = new Map();
    for (const p of places) {
      if (!p.stopId) continue;
      const name = cleanName(p.name);
      const g = byName.get(name) || { name, ids: [], dist: Infinity };
      if (!g.ids.includes(p.stopId)) g.ids.push(p.stopId);
      if (origin) g.dist = Math.min(g.dist, distM(origin, p));
      byName.set(name, g);
    }
    return [...byName.values()];
  }

  // ---------- Darstellung ----------
  function showState(title, text, action) {
    els.content.innerHTML = `<div class="state"><strong>${esc(title)}</strong>${esc(text)}${
      action ? `<br><button type="button" id="stateBtn">${esc(action.label)}</button>` : ''}</div>`;
    if (action) $('stateBtn').onclick = action.fn;
  }

  function renderStops(list, container, onPick) {
    container.innerHTML = '';
    for (const g of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', current && current.name === g.name ? 'true' : 'false');
      b.innerHTML = esc(g.name) + (isFinite(g.dist) ? `<small>${Math.round(g.dist)} m</small>` : '');
      b.onclick = () => onPick(g);
      container.appendChild(b);
    }
  }

  function render() {
    if (!current) return;
    renderTargets();
    if (trip) return renderTrip();
    els.title.textContent = current.name;
    els.dist.textContent = isFinite(current.dist) ? fmtDist(current.dist) : '';
    els.updated.textContent = lastFetch ? `Stand ${fmtTime(lastFetch)}` : '';

    const now = Date.now();
    const hide = hiddenHere();
    const note = hide.length
      ? `<p class="hiddenNote">Ausgeblendet: ${hide.map((h, i) =>
          `<button type="button" data-unhide="${i}" aria-label="Richtung ${esc(h)} wieder anzeigen">${esc(h)} einblenden</button>`).join('')}</p>`
      : '';
    const list = departures
      .filter(d => !els.tramOnly.checked || d.mode === 'TRAM')
      .filter(d => !hide.includes(cleanName(d.headsign)))
      .filter(d => d.time.getTime() > now - 60000)
      .slice(0, 15);

    if (!list.length) {
      if (hide.length) {
        showState('Keine Abfahrten gefunden', 'In den angezeigten Richtungen fährt in nächster Zeit nichts.');
        els.content.insertAdjacentHTML('beforeend', note);
        bindNote(hide);
        return;
      }
      showState('Keine Abfahrten gefunden',
        els.tramOnly.checked
          ? 'An dieser Haltestelle fährt in nächster Zeit keine Straßenbahn. Schalte „Nur Straßenbahn“ aus, um auch Busse zu sehen.'
          : 'Für diese Haltestelle liegen gerade keine Abfahrten vor.');
      return;
    }

    const html = list.map(d => {
      const mins = Math.round((d.time.getTime() - now) / 60000);
      let minHtml, minCls = 'min';
      if (d.cancelled) { minHtml = fmtTime(d.time); minCls += ' clock'; }
      else if (mins <= 0) { minHtml = 'jetzt'; minCls += ' now'; }
      else if (mins > 59) { minHtml = fmtTime(d.time); minCls += ' clock'; }
      else { minHtml = `${mins}<span>min</span>`; }

      // Unterzeile: was du brauchst, um die Bahn zu erwischen.
      const sub = [];
      const track = d.track ? `<span>Steig ${esc(d.track)}</span>` : '';
      if (d.cancelled) {
        sub.push('<span class="cancel">Fällt aus</span>', track); // Uhrzeit steht schon rechts
        if (d.alt) sub.push(`<span>Bahn fährt ab ${esc(d.alt.name)}, ${d.alt.mins} min zu Fuß</span>`);
      } else {
        sub.push(`<span>${fmtTime(d.time)}</span>`, track);
        if (!d.realTime) sub.push('<span>nur Fahrplan</span>');
        else if (d.delay > 0) sub.push(`<span class="late">+${d.delay}</span>`);
        else if (d.delay < 0) sub.push(`<span class="ok">\u2212${-d.delay}</span>`);
      }

      const bg = hex(d.color), fg = hex(d.textColor) || '#FFFFFF';
      const style = bg ? ` style="background:${bg};color:${fg}"` : '';
      const line = d.line || '?';
      return `<li class="${d.cancelled ? 'cancelled' : ''}">
        <div class="badge${line.length > 3 ? ' long' : ''}"${style}>${esc(line)}</div>
        <div><button type="button" class="dest" data-dest="${esc(cleanName(d.headsign))}" title="Richtung an dieser Haltestelle ausblenden">${esc(cleanName(d.headsign) || 'unbekannt')}</button><div class="sub">${sub.join('')}</div></div>
        <div class="${minCls}">${minHtml}</div>
      </li>`;
    }).join('');
    els.content.innerHTML = `<ol class="board" aria-label="Nächste Abfahrten">${html}</ol>${note}`;
    bindNote(hide);
  }

  function bindNote(hide) {
    els.content.querySelectorAll('[data-unhide]').forEach(b => {
      b.onclick = () => setHidden(hide.filter((_, i) => i !== Number(b.dataset.unhide)));
    });
  }

  // Tippen auf ein Ziel blendet diese Richtung an der aktuellen Haltestelle aus.
  els.content.addEventListener('click', e => {
    const b = e.target.closest('[data-dest]');
    if (!b || !current || !b.dataset.dest) return;
    const dest = b.dataset.dest;
    if (confirm(`Abfahrten Richtung „${dest}“ an ${current.name} künftig ausblenden?`)) {
      setHidden([...hiddenHere().filter(h => h !== dest), dest]);
    }
  });

  // ---------- Daten ----------
  async function loadDepartures(flash) {
    if (!current) return;
    try {
      const ids = current.ids.slice(0, MAX_PLATFORMS);
      const results = await Promise.all(ids.map(id =>
        api('/api/v5/stoptimes', { stopId: id, n: 20 }).catch(() => null)));
      if (results.every(r => r === null)) throw new Error('Keine Antwort');

      const seen = new Set(), out = [];
      for (const r of results) {
        for (const st of (r && r.stopTimes) || []) {
          const p = st.place || {};
          const t = p.departure || p.arrival;
          if (!t) continue;
          const key = (st.tripId || st.headsign) + '|' + (p.scheduledDeparture || t);
          if (seen.has(key)) continue;
          seen.add(key);
          const sched = new Date(p.scheduledDeparture || p.scheduledArrival || t);
          const cancelled = !!(st.cancelled || st.tripCancelled || p.cancelled);
          // Gestrichene Halte tragen oft verschobene Zeiten: dann zählt die Planzeit.
          const time = cancelled ? sched : new Date(t);

          // Hält die Bahn nur hier nicht, fährt aber in der Nähe ab? Dann Ausweichhalt nennen.
          let alt = null;
          const f = st.tripFrom;
          if (cancelled && !st.tripCancelled && f && f.name && cleanName(f.name) !== cleanName(p.name)
              && !f.cancelled && f.lat != null && p.lat != null) {
            const m = distM(p, f);
            if (m <= 1200) alt = { name: cleanName(f.name), mins: Math.max(1, Math.round(m * 1.3 / 75)) };
          }

          out.push({
            time, sched, alt,
            delay: Math.round((time - sched) / 60000),
            realTime: !!st.realTime,
            cancelled,
            mode: st.mode,
            line: st.routeShortName || st.displayName || '',
            headsign: st.headsign,
            color: st.routeColor,
            textColor: st.routeTextColor,
            track: p.track
          });
        }
      }
      departures = out.sort((a, b) => a.time - b.time);
      lastFetch = new Date();
      render();
      if (flash) {
        const b = els.content.querySelector('.board');
        if (b) { b.classList.add('fresh'); setTimeout(() => b.classList.remove('fresh'), 600); }
      }
    } catch (e) {
      console.error('Abfahrten fehlgeschlagen:', e);
      if (!departures.length) {
        showState('Abfahrten konnten nicht geladen werden',
          'Die Datenquelle antwortet gerade nicht. Der nächste Versuch folgt automatisch in 30 Sekunden.',
          { label: 'Jetzt erneut laden', fn: () => loadDepartures(true) });
      } else {
        els.updated.textContent = `Stand ${fmtTime(lastFetch)}, Aktualisierung fehlgeschlagen`;
      }
    }
  }

  // ---------- Fahrtsuche ----------
  function renderTargets() {
    els.trips.innerHTML = '';
    for (const t of TARGETS) {
      if (current && norm(current.name) === norm(t.name)) continue; // schon dort
      const b = document.createElement('button');
      b.type = 'button';
      if (t.home) b.className = 'home';
      b.setAttribute('aria-pressed', trip === t ? 'true' : 'false');
      b.textContent = t.label;
      b.onclick = () => (trip === t ? closeTrip() : openTrip(t));
      els.trips.appendChild(b);
    }
  }

  async function resolveTarget(t) {
    const cache = store.get('targetIds') || {};
    if (cache[t.name]) return cache[t.name];
    const res = await api('/api/v1/geocode', { text: 'Freiburg ' + t.name, type: 'STOP', language: 'de' });
    const list = (res || []).filter(m => m.id || m.stopId);
    const hit = list.find(m => norm(cleanName(m.name)) === norm(t.name))
      || list.find(m => norm(m.name).includes(norm(t.name)));
    if (!hit) throw new Error(`Haltestelle „${t.name}“ wurde nicht gefunden. Prüfe die Schreibweise in TARGETS.`);
    cache[t.name] = hit.stopId || hit.id;
    store.set('targetIds', cache);
    return cache[t.name];
  }

  function openTrip(t) {
    trip = t;
    itineraries = [];
    renderTargets();
    showState('Suche Verbindungen …', '');
    loadTrip(false);
    restartTimer();
  }

  function closeTrip() {
    trip = null;
    itineraries = [];
    render();
    loadDepartures(false);
    restartTimer();
  }

  async function loadTrip(flash) {
    const t = trip;
    try {
      const toPlace = await resolveTarget(t);
      const fromPlace = here
        ? `${here.lat.toFixed(4)},${here.lon.toFixed(4)}`
        : current.ids[0];
      const data = await api('/api/v5/plan', {
        fromPlace, toPlace, time: new Date().toISOString(), detailedTransfers: false
      });
      if (trip !== t) return; // inzwischen anderes Ziel gewählt
      itineraries = (data.itineraries || []).filter(it => it.legs && it.legs.length);
      lastFetch = new Date();
      render();
      if (flash) {
        const b = els.content.querySelector('.board');
        if (b) { b.classList.add('fresh'); setTimeout(() => b.classList.remove('fresh'), 600); }
      }
    } catch (e) {
      console.error('Verbindungssuche fehlgeschlagen:', e);
      if (trip !== t) return;
      if (!itineraries.length) showState('Verbindungen konnten nicht geladen werden', 'Technischer Grund: ' + e.message);
    }
  }

  function legTimes(l) {
    const dep = new Date(l.startTime || (l.from && l.from.departure));
    const depPlan = new Date(l.scheduledStartTime || (l.from && l.from.scheduledDeparture) || dep);
    const arr = new Date(l.endTime || (l.to && l.to.arrival));
    const arrPlan = new Date(l.scheduledEndTime || (l.to && l.to.scheduledArrival) || arr);
    return { dep, depPlan, arr, arrPlan, delay: Math.round((dep - depPlan) / 60000) };
  }

  function renderTrip() {
    els.title.textContent = trip.home ? 'Nach Hause' : trip.label;
    els.dist.textContent = here ? 'ab deinem Standort' : `ab ${current.name}`;
    els.updated.textContent = lastFetch ? `Stand ${fmtTime(lastFetch)}` : '';
    const back = '<p class="back"><button type="button" class="linkbtn" id="backBtn">Zurück zu den Abfahrten</button></p>';
    const now = Date.now();
    const list = itineraries.filter(it => new Date(it.startTime).getTime() > now - 60000).slice(0, 4);

    if (!list.length) {
      els.content.innerHTML = back + '<div class="state"><strong>Keine Verbindung gefunden</strong>Für die nächste Zeit liegt keine Verbindung vor.</div>';
    } else {
      const html = list.map(it => {
        const start = new Date(it.startTime), end = new Date(it.endTime);
        const mins = Math.round((start - now) / 60000);
        const minHtml = mins <= 0 ? 'jetzt' : mins > 59 ? fmtTime(start) : `${mins}<span>min bis los</span>`;
        const minCls = 'min' + (mins <= 0 ? ' now' : mins > 59 ? ' clock' : '');
        const dur = Math.round((it.duration || (end - start) / 1000) / 60);
        const transit = it.legs.filter(l => l.mode !== 'WALK');
        const tr = it.transfers ?? Math.max(0, transit.length - 1);

        const legs = it.legs.map(l => {
          const lt = legTimes(l);
          const m = Math.max(1, Math.round((lt.arr - lt.dep) / 60000));
          if (l.mode === 'WALK') return `<span class="walk">zu Fuß ${m} min</span>`;
          const bg = hex(l.routeColor), fg = hex(l.routeTextColor) || '#FFFFFF';
          const st = bg ? ` style="background:${bg};color:${fg}"` : '';
          return `<span class="badge sm"${st}>${esc(l.routeShortName || l.displayName || '?')}</span>`;
        }).join('');

        const detail = transit.map(l => {
          const lt = legTimes(l);
          const late = l.realTime && lt.delay > 0 ? ` <span class="late">+${lt.delay}</span>` : '';
          const track = l.from && l.from.track ? `, Steig ${esc(l.from.track)}` : '';
          return `<div>${esc(l.routeShortName || '')} ab ${esc(cleanName(l.from && l.from.name))} ${fmtTime(lt.dep)}${late}${track}, an ${esc(cleanName(l.to && l.to.name))} ${fmtTime(lt.arr)}</div>`;
        }).join('');

        const noRt = transit.length && !transit.some(l => l.realTime) ? '<span>nur Fahrplan</span>' : '';
        return `<li>
          <div>
            <div class="times">${fmtTime(start)} bis ${fmtTime(end)}</div>
            <div class="sub"><span>${dur} min</span><span>${tr === 0 ? 'ohne Umstieg' : tr === 1 ? '1 Umstieg' : tr + ' Umstiege'}</span>${noRt}</div>
            <div class="legs">${legs}</div>
            <div class="detail sub" style="display:block">${detail}</div>
          </div>
          <div class="${minCls}">${minHtml}</div>
        </li>`;
      }).join('');
      els.content.innerHTML = back + `<ol class="board trip" aria-label="Verbindungen">${html}</ol>`;
    }
    $('backBtn').onclick = closeTrip;
  }

  function refresh(flash) { return trip ? loadTrip(flash) : loadDepartures(flash); }

  function selectStop(g) {
    trip = null;
    itineraries = [];
    current = g;
    departures = [];
    lastFetch = null;
    store.set('lastStop', { name: g.name, ids: g.ids });
    renderStops(groups, els.stops, selectStop);
    els.title.textContent = g.name;
    showState('Lade Abfahrten …', '');
    loadDepartures(false);
    restartTimer();
  }

  async function findNearby(origin) {
    let span = 0.004; // ca. 450 m Breite, wird bei Bedarf vergrößert
    for (let i = 0; i < 4; i++) {
      const min = `${origin.lat - span},${origin.lon - span * 1.5}`;
      const max = `${origin.lat + span},${origin.lon + span * 1.5}`;
      const places = await api('/api/v1/map/stops', { min, max });
      const g = groupStops(Array.isArray(places) ? places : [], origin)
        .sort((a, b) => a.dist - b.dist).slice(0, 6);
      if (g.length) return g;
      span *= 2;
    }
    return [];
  }

  function locate() {
    if (!('geolocation' in navigator)) {
      showState('Standort nicht verfügbar', 'Dein Browser kann den Standort nicht bestimmen. Suche die Haltestelle über „Haltestelle suchen“.');
      return;
    }
    showState('Suche Haltestellen in deiner Nähe …', '');
    navigator.geolocation.getCurrentPosition(async pos => {
      const origin = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      here = origin;
      try {
        groups = await findNearby(origin);
        if (!groups.length) {
          showState('Keine Haltestelle in der Nähe', 'Im Umkreis von etwa drei Kilometern wurde nichts gefunden. Suche die Haltestelle über „Haltestelle suchen“.');
          return;
        }
        selectStop(groups[0]);
      } catch (e) {
        console.error('Haltestellensuche fehlgeschlagen:', e);
        showState('Haltestellen konnten nicht geladen werden', 'Technischer Grund: ' + e.message,
          { label: 'Erneut versuchen', fn: locate });
      }
    }, err => {
      const last = store.get('lastStop');
      if (last) { groups = [{ ...last, dist: Infinity }]; selectStop(groups[0]); return; }
      showState('Standort nicht freigegeben',
        err.code === 1
          ? 'Erlaube den Standortzugriff für diese Seite oder suche die Haltestelle über „Haltestelle suchen“.'
          : 'Der Standort konnte nicht bestimmt werden. Suche die Haltestelle über „Haltestelle suchen“.',
        { label: 'Standort erneut abfragen', fn: locate });
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- Suche ----------
  let searchTimer;
  els.toggleSearch.onclick = () => {
    const open = els.searchForm.hidden;
    els.searchForm.hidden = !open;
    els.searchResults.hidden = !open;
    els.toggleSearch.textContent = open ? 'Suche schließen' : 'Haltestelle suchen';
    if (open) els.searchInput.focus();
  };
  els.searchForm.onsubmit = e => e.preventDefault();
  els.searchInput.oninput = () => {
    clearTimeout(searchTimer);
    const text = els.searchInput.value.trim();
    if (text.length < 3) { els.searchResults.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      try {
        const res = await api('/api/v1/geocode', { text: 'Freiburg ' + text, type: 'STOP', language: 'de' });
        const found = groupStops((res || []).map(m => ({ ...m, stopId: m.stopId || m.id })), null).slice(0, 8);
        renderStops(found, els.searchResults, g => {
          here = null;
          groups = [g, ...groups.filter(x => x.name !== g.name)];
          els.toggleSearch.click();
          selectStop(g);
        });
      } catch { els.searchResults.innerHTML = ''; }
    }, 350);
  };

  // ---------- Zeitsteuerung ----------
  function restartTimer() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => { if (!document.hidden) refresh(true); }, trip ? 60000 : REFRESH_MS);
  }
  setInterval(() => { if (!document.hidden && (departures.length || itineraries.length)) render(); }, TICK_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && current) { refresh(true); restartTimer(); }
  });
  els.tramOnly.onchange = () => { store.set('tramOnly', els.tramOnly.checked); render(); };

  locate();
})();
</script>
</body>
</html>
